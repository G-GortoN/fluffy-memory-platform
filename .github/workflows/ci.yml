name: Verify Fluffy Memory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_COOKIE_SECURE: 'false'
      APP_SIMULATED_PAYMENTS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify container stack and shopping flow
        run: |
          export DATABASE_PASSWORD="$(openssl rand -hex 24)"
          export APP_ADMIN_EMAIL=admin@example.test
          export APP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8087/ | grep 'Fluffy Memory'
          curl --fail --silent http://127.0.0.1:8087/shop | grep 'Fluffy Memory'
          python3 deploy/smoke.py --base-url http://127.0.0.1:8087
      - name: Verify NAS deployment and package its release
        shell: bash
        run: |
          export DATABASE_PASSWORD="$(openssl rand -hex 24)"
          export APP_ADMIN_EMAIL=admin@example.test
          export APP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export API_IMAGE="fluffy-memory-api:${GITHUB_SHA}"
          export WEB_IMAGE="fluffy-memory-web:${GITHUB_SHA}"
          TAILSCALE_IMAGE=tailscale/tailscale:stable docker compose \
            -f deploy/compose.nas.yml -f deploy/compose.nas-funnel.yml config --quiet
          for service in api web; do
            image_id="$(docker compose -f deploy/compose.yml images -q "$service")"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
            docker image tag "$image_id" "fluffy-memory-${service}:${GITHUB_SHA}"
          done
          docker compose -f deploy/compose.nas.yml up -d --no-build --wait --wait-timeout 120
          if [ "$(curl -fsS http://127.0.0.1:18082/healthz)" != ok ]; then
            echo '::error::NAS web health endpoint did not return ok'
            exit 1
          fi
          curl -fsS http://127.0.0.1:18082/api/products |
            python3 -c 'import json,sys; products=json.load(sys.stdin); assert isinstance(products, list) and products'
          curl -fsS -D "${RUNNER_TEMP}/fluffy-memory-headers" -o /dev/null http://127.0.0.1:18082/api/auth/csrf
          for attribute in Secure HttpOnly SameSite=Lax; do
            if ! grep -Eqi "^Set-Cookie: FLUFFY_SESSION=.*; ${attribute}(;|[[:space:]]*$)" "${RUNNER_TEMP}/fluffy-memory-headers"; then
              echo "::error::NAS session cookie is missing ${attribute}"
              exit 1
            fi
          done
          docker compose -f deploy/compose.nas.yml exec -T api sh -ec 'test "$(id -u)" = 10001; touch /app/media/.ci-check; rm /app/media/.ci-check'
          docker compose -f deploy/compose.nas.yml exec -T web sh -ec 'test "$(id -u)" = 10001'

          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            release_dir="${RUNNER_TEMP}/fluffy-memory-release"
            mkdir -p "$release_dir"
            docker image save "$API_IMAGE" "$WEB_IMAGE" | gzip -1 > "$release_dir/fluffy-memory-images.tar.gz"
            printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" > "$release_dir/images.env"
            (cd "$release_dir" && sha256sum fluffy-memory-images.tar.gz images.env > SHA256SUMS)

            web_release_dir="${RUNNER_TEMP}/fluffy-memory-web-release"
            mkdir -p "$web_release_dir"
            docker compose -f deploy/compose.nas.yml exec -T web tar -C /srv -cf - . |
              gzip -1 > "$web_release_dir/web.tar.gz"
            tar -tzf "$web_release_dir/web.tar.gz" | grep -Fx './index.html' > /dev/null
            printf '%s\n' "$GITHUB_SHA" > "$web_release_dir/revision"
            (cd "$web_release_dir" && sha256sum web.tar.gz revision > SHA256SUMS)
          fi
      - name: Upload private NAS image package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nas-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/fluffy-memory-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload private NAS web layer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nas-web-${{ github.sha }}
          path: ${{ runner.temp }}/fluffy-memory-web-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Collect service logs
        if: failure()
        run: |
          DATABASE_PASSWORD=unused docker compose -f deploy/compose.yml logs --no-color
          DATABASE_PASSWORD=unused APP_ADMIN_EMAIL=admin@example.test APP_ADMIN_PASSWORD=unused \
            API_IMAGE="fluffy-memory-api:${GITHUB_SHA}" WEB_IMAGE="fluffy-memory-web:${GITHUB_SHA}" docker compose \
            -f deploy/compose.nas.yml logs --no-color
      - name: Remove temporary containers
        if: always()
        run: |
          DATABASE_PASSWORD=unused docker compose -f deploy/compose.yml down --volumes
          DATABASE_PASSWORD=unused APP_ADMIN_EMAIL=admin@example.test APP_ADMIN_PASSWORD=unused \
            API_IMAGE="fluffy-memory-api:${GITHUB_SHA}" WEB_IMAGE="fluffy-memory-web:${GITHUB_SHA}" docker compose \
            -f deploy/compose.nas.yml down --volumes

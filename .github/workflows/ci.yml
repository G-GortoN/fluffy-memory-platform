name: Verify Fluffy Memory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_COOKIE_SECURE: 'false'
      APP_SIMULATED_PAYMENTS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify container stack and shopping flow
        run: |
          export DATABASE_PASSWORD="$(openssl rand -hex 24)"
          export APP_ADMIN_EMAIL=admin@example.test
          export APP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8087/ | grep 'Fluffy Memory'
          curl --fail --silent http://127.0.0.1:8087/shop | grep 'Fluffy Memory'
          python3 deploy/smoke.py --base-url http://127.0.0.1:8087
      - name: Collect service logs
        if: failure()
        run: DATABASE_PASSWORD=unused docker compose -f deploy/compose.yml logs --no-color
      - name: Remove temporary containers
        if: always()
        run: DATABASE_PASSWORD=unused docker compose -f deploy/compose.yml down --volumes

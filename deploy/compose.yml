name: fluffy-memory

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluffy_memory
      POSTGRES_USER: fluffy_memory
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fluffy_memory -d fluffy_memory']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fluffy_memory
      DATABASE_USERNAME: fluffy_memory
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in deploy/.env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_SIMULATED_PAYMENTS: ${APP_SIMULATED_PAYMENTS:-false}
      APP_API_DOCS: ${APP_API_DOCS:-false}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8087}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  media:
